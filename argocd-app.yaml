apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexadesk
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/0gf8z/nexadeskdevops2026.git
    targetRevision: HEAD
    path: environments/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: nexadesk-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
