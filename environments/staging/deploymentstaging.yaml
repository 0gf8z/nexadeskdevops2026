apiVersion: v1
kind: Namespace
metadata:
  name: nexadesk-staging
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexadesk-api
  namespace: nexadesk-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexadesk-api
  template:
    metadata:
      labels:
        app: nexadesk-api
    spec:
      containers:
      - name: nexadesk-api
        image: ghcr.io/0gf8z/nexadeskdevops2026/nexadesk-api:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: nexadesk-api
  namespace: nexadesk-staging
spec:
  type: NodePort
  selector:
    app: nexadesk-api
  ports:
  - port: 3000
    targetPort: 3000