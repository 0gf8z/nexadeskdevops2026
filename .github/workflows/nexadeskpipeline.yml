name: CI/CD
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t nexadesk-api app/api

      - name: Enviar imagem
        run: docker push ghcr.io/0gf8z/nexadesk-api:latest