name: CI/CD

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: |
          docker build -t ghcr.io/0gf8z/nexadesk-api:${{ github.sha }} app/api
          docker push ghcr.io/0gf8z/nexadesk-api:${{ github.sha }}

  staging:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i "s|image: ghcr.io/0gf8z/nexadesk-api:.*|image: ghcr.io/0gf8z/nexadesk-api:${{ github.sha }}|" environments/staging/deploymentstaging.yaml
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add environments/staging/deploymentstaging.yaml
          git commit -m "deploy staging: ${{ github.sha }}" || true
          git pull origin main --rebase --autostash || true
          git push origin main --force

  producao:
    runs-on: ubuntu-latest
    needs: staging
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i "s|image: ghcr.io/0gf8z/nexadesk-api:.*|image: ghcr.io/0gf8z/nexadesk-api:${{ github.sha }}|" environments/prod/deploymentprod.yaml
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add environments/prod/deploymentprod.yaml
          git commit -m "deploy prod: ${{ github.sha }}" || true
          git pull origin main --rebase --autostash || true
          git push origin main --force