name: CI/CD
on:
  push:
    branches: [main, develop]
env:
  IMAGE: ghcr.io/${{ github.repository }}/nexadesk-api:${{ github.sha }}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - working-directory: app/api
        run: |
          npm install
          npm test
          npm run lint
      - run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - run: |
          docker build -t $IMAGE app/api
          docker push $IMAGE
      - if: github.ref == 'refs/heads/develop'
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > kubeconfig
          kubectl --kubeconfig=kubeconfig apply -f environments/staging/deploymentstaging.yaml
          kubectl --kubeconfig=kubeconfig set image deployment/nexadesk-api nexadesk-api=$IMAGE -n nexadesk-staging
      - if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > kubeconfig
          kubectl --kubeconfig=kubeconfig apply -f environments/prod/deploymentprod.yaml
          kubectl --kubeconfig=kubeconfig set image deployment/nexadesk-api nexadesk-api=$IMAGE -n nexadesk-prod